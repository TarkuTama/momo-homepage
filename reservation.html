    <main>

        <img src="images/text_yoyakuuketsukechu.png" alt="予約受付中">

        <h2>宿泊予約</h2>

        <form id="reservation-form">

            <div class="form-group">
                <label for="checkin">チェックイン</label>
                <input type="date" id="checkin" required>
            </div>

            <div class="form-group">
                <label for="checkout">チェックアウト</label>
                <input type="date" id="checkout" required>
            </div>

            <div class="form-group">
                <label for="guests">宿泊人数</label>
                <input type="number" id="guests" min="1" required>
            </div>

            <button type="button" id="check-button">空室を確認する</button>

        </form>

        <p id="result"></p>





        
        <!-- 空室がある場合だけ表示 -->

        <div id="price-info" style="display: none;">
            <h2>宿泊料金</h2>
            
            <p>
                宿泊数：
                <span id="nights"></span>泊
            </p>
            
            <p> 
                1泊あたり：
                <span id="price-per-night"></span>円
            </p>

            <p>
                合計料金：
                <strong>
                    <span id="total-price"></span>円
                </strong>
            </p>
        </div>
        





        <div id="customer-form" style="display: none;">

        <h2>お客様情報</h2>

        <div class="form-group">
            <label for="name">お名前</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="phone">電話番号</label>
            <input type="tel" id="phone" required>
        </div>

        <button type="button" id="reserve-button">
            予約を確定する
        </button>

    </div>

    <p id="reserve-result"></p>

    </main>
