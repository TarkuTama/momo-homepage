<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>管理者ログイン</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            padding: 10px 20px;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>管理者ログイン</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="username">
            ユーザー名
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">
            パスワード
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            ログイン
        </button>

    </form>

</div>

</body>
</html>
